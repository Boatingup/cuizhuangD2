[CLIENTSETUP]
# if connet to server failed  the delay to retry 
RetryTime=2000
# 0 means only oneself  1  means all  for testing
Report=0
# the press filter of audio unit ms
AudioBCFilterTime=500
# the time between check AudioBCFilter unit ms
AudioBCFilterPeriod=500
# the player check time  check server is on or off every period to start or stop player
PlayerCheckPeriod=300
[SERVERSETUP]
# port the server port
Port=4840
# 0 means only oneself  1  means all  for testing
Report=0
# the name of netcard
NetCartName=eth0
#RunMode:integrate or alone, alone means runby itself,use serial to get data,intergrate means get data from acs meessage queue
RunMode=alone
#Serverlist serversip
#ip min
ipsmall=107
#ip max
ipbig=112
Mode=rs485
#namespace






